<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banners — Aulão MMA com o Lennon</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0a0a0c;
        color: #f2f2f2;
        font-family: Inter, "Segoe UI", sans-serif;
        padding: 32px 20px 64px;
      }
      h1,
      p {
        text-align: center;
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
      }
      h1 {
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        color: #b8b8bc;
      }
      .grid {
        display: grid;
        gap: 28px;
        max-width: 1100px;
        margin: 40px auto 0;
      }
      figure {
        margin: 0;
        background: #141418;
        border: 1px solid #2a2a30;
        padding: 16px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
        color: #c8c8cc;
      }
    </style>
  </head>
  <body>
    <h1>Aulão com o Lennon</h1>
    <p>MMA · Striking · Grappling — sábado 19/09, das 13h às 16h</p>
    <div class="grid">
      <figure>
        <img src="export/aulao-mma-stories.jpg" alt="Banner vertical para Stories e Status" />
        <figcaption>Stories / Status — 1080×1920</figcaption>
      </figure>
      <figure>
        <img src="export/aulao-mma-feed.jpg" alt="Banner 4:5 para o feed do Instagram" />
        <figcaption>Feed Instagram — 1080×1350</figcaption>
      </figure>
      <figure>
        <img src="export/aulao-mma-quadrado.jpg" alt="Banner quadrado para WhatsApp e feed" />
        <figcaption>Quadrado — 1080×1080</figcaption>
      </figure>
      <figure>
        <img src="export/aulao-mma-horizontal.jpg" alt="Banner horizontal 16:9" />
        <figcaption>Horizontal — 1920×1080</figcaption>
      </figure>
    </div>
  </body>
</html>
